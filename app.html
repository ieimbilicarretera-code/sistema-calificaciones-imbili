<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IE Imbilí Carretera • Panel</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <div class="shell">

      <div class="card">
        <div class="header">
          <div class="logo"><img src="assets/logo.png" alt="Logo IE"></div>

          <div class="hgroup">
            <h1 id="instName">Institución Educativa Imbilí Carretera</h1>
            <p>Bienvenido(a): <b id="userName">---</b> — Rol: <b id="userRole">---</b></p>
          </div>

          <div class="chips">
            <div class="chip">Año lectivo: <b id="anioLectivo">…</b></div>
            <div class="chip">Períodos: <b id="periodos">…</b></div>
          </div>
        </div>

        <div class="content">

          <div class="panel">
            <div class="row" style="justify-content:space-between;">
              <div>
                <h2>Panel principal</h2>
                <p>Selecciona un módulo para continuar. Los módulos visibles dependen del rol/permisos.</p>
              </div>
              <div class="btns">
                <button class="btn-danger" id="btnLogout">Cerrar sesión</button>
              </div>
            </div>

            <div class="hr"></div>

            <h2 style="margin-top:0">Módulos</h2>
            <div class="modules" id="modulesGrid"></div>

            <div class="msg" id="appMsg"></div>
          </div>

        </div>

        <div class="footer">
          <span>© <span id="year"></span> IE Imbilí Carretera</span>
          <span class="small">Consejo: si un módulo no aparece, es por permisos/rol.</span>
        </div>
      </div>

    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
