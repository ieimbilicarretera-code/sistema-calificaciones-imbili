<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Ingreso | Sistema de calificaciones - IE Imbilí Carretera</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page">
    <div class="card small">

      <div class="brand">
        <img src="logo-ie.png" class="logo-ie" alt="IE Imbilí Carretera">
        <div>
          <h1 id="instName">Institución Educativa Imbilí Carretera</h1>
          <p>Sistema de calificaciones</p>
        </div>
      </div>

      <!-- LOGIN -->
      <div id="loginView">
        <div class="field">
          <label>Correo</label>
          <input id="email" type="email" placeholder="usuario@correo.com" autocomplete="username">
        </div>

        <div class="field" style="margin-top:10px;">
          <label>Contraseña</label>
          <input id="password" type="password" placeholder="••••••••" autocomplete="current-password">
        </div>

        <div class="actions">
          <button class="btn" id="btnLogin">Ingresar</button>
          <a href="#" id="linkForgot">Olvidé mi contraseña</a>
        </div>
      </div>

      <!-- OLVIDÉ CONTRASEÑA -->
      <div id="forgotView" class="hidden">
        <h2 style="margin:0 0 6px 0; font-size:16px;">Recuperación de contraseña</h2>
        <p class="muted">Ingresa tu correo. Se enviará un enlace para restablecer.</p>

        <div class="field" style="margin-top:10px;">
          <label>Correo</label>
          <input id="forgotEmail" type="email" placeholder="usuario@correo.com">
        </div>

        <div class="actions">
          <button class="btn" id="btnSendReset">Enviar</button>
          <button class="btn secondary" id="btnBackLogin">Volver</button>
        </div>

        <p class="info" id="forgotMsg"></p>
      </div>

      <!-- CAMBIO OBLIGATORIO -->
      <div id="forceChangeView" class="hidden">
        <h2 style="margin:0 0 6px 0; font-size:16px;">Debes cambiar tu contraseña</h2>
        <p class="muted">Por seguridad, configura una nueva contraseña.</p>

        <div class="row" style="margin-top:10px;">
          <div class="field">
            <label>Nueva contraseña</label>
            <input id="newPass1" type="password" placeholder="Mínimo 6 caracteres">
          </div>
          <div class="field">
            <label>Confirmar contraseña</label>
            <input id="newPass2" type="password" placeholder="Repite la contraseña">
          </div>
        </div>

        <div class="actions">
          <button class="btn" id="btnUpdatePass">Actualizar</button>
          <button class="btn secondary" id="btnBackToLogin2">Volver</button>
        </div>

        <p class="info" id="changeMsg"></p>
      </div>

      <div class="footer">
        © <span id="year"></span> IE Imbilí Carretera
      </div>
    </div>
  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
